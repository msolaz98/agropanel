name: Prueba fuentes (temporal)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: AEMET con cabeceras de navegador
        continue-on-error: true
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for u in https://www.aemet.es/xml/municipios/localidad_46250.xml https://www.aemet.es/xml/municipios_h/localidad_h_46250.xml; do
            echo "=== $u"; curl -sS -D /tmp/h.txt -o /tmp/f.xml -A "$UA" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" -H "Accept-Language: es-ES,es;q=0.9" -H "Origin: https://msolaz98.github.io" "$u"
            grep -i -E "^HTTP|access-control|content-type" /tmp/h.txt; head -c 1200 /tmp/f.xml; echo; echo "periodos: $(grep -c periodo /tmp/f.xml)"; done
      - name: Open-Meteo ECMWF
        run: |
          curl -sS -D /tmp/h2.txt -o /tmp/o.json "https://api.open-meteo.com/v1/forecast?latitude=39.47&longitude=-0.38&models=ecmwf_ifs&hourly=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,et0_fao_evapotranspiration,wind_speed_10m_max,precipitation_probability_max&forecast_days=10&timezone=Europe%2FMadrid"
          grep -i -E "^HTTP|access-control" /tmp/h2.txt
          python3 -c "import json;d=json.load(open('/tmp/o.json'));print({k:v for k,v in d.items() if k not in('hourly','daily')});print('daily:',{k:(v[:3] if isinstance(v,list) else v) for k,v in d.get('daily',{}).items()});h=d.get('hourly',{});print('hr nulls:',sum(1 for x in h.get('relative_humidity_2m',[]) if x is None),'of',len(h.get('relative_humidity_2m',[])))"
