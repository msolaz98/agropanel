name: Prueba fuentes (temporal)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: AEMET diaria y horaria (Valencia 46250, Sueca 46235)
        run: |
          for u in https://www.aemet.es/xml/municipios/localidad_46250.xml https://www.aemet.es/xml/municipios_h/localidad_h_46250.xml https://www.aemet.es/xml/municipios_h/localidad_h_46235.xml; do
            echo "=== $u"; curl -sS -D - -o /tmp/f.xml -H "Origin: https://msolaz98.github.io" "$u" | grep -i -E "^HTTP|access-control|content-type|content-length"; head -c 1500 /tmp/f.xml; echo; echo "..."; grep -o "<dia[^>]*>" /tmp/f.xml | head -3; grep -c "periodo" /tmp/f.xml; done
      - name: Open-Meteo ECMWF
        run: |
          curl -sS -D - -o /tmp/o.json "https://api.open-meteo.com/v1/forecast?latitude=39.47&longitude=-0.38&models=ecmwf_ifs&hourly=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,et0_fao_evapotranspiration,wind_speed_10m_max,precipitation_probability_max&forecast_days=10&timezone=Europe%2FMadrid" | grep -i -E "^HTTP|access-control"
          python3 -c "import json;d=json.load(open('/tmp/o.json'));print({k:v for k,v in d.items() if k not in('hourly','daily')});print('daily:',{k:(v[:4] if isinstance(v,list) else v) for k,v in d.get('daily',{}).items()});h=d.get('hourly',{});print('hourly hr nulls:',sum(1 for x in h.get('relative_humidity_2m',[]) if x is None),'of',len(h.get('relative_humidity_2m',[])))"
